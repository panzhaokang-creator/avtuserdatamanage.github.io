<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="renderer" content="webkit" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="智能设备管理平台 - 便捷连接、配置和管理您的智能设备" />
  <meta name="keywords" content="智能设备,物联网,IoT,设备管理,蓝牙配置" />
  <meta name="author" content="Your Company" />

  <!-- Open Graph / Social -->
  <meta property="og:title" content="智能设备管理平台" />
  <meta property="og:description" content="便捷连接、配置和管理您的智能设备" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />

  <!-- DNS Prefetch & Preconnect -->
  <link rel="dns-prefetch" href="//cdn.example.com" />
  <link rel="preconnect" href="//cdn.example.com" crossorigin />

  <!-- Preload critical resources -->
  <link rel="preload" href="/static/images/login/logo.png" as="image" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <title>智能设备管理平台</title>

  <!-- Critical CSS (inline for fast first paint) -->
  <style>
    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
        'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f5f7fa;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Loading placeholder */
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .app-loading .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .app-loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #2979ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    .app-loading p {
      font-size: 14px;
      color: #999;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }

    /* Utility: screen-reader only */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <!-- Non-critical CSS (deferred) -->
  <link rel="preload" href="/common.scss" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="/common.scss" /></noscript>
</head>
<body>
  <div id="app">
    <!-- Loading placeholder shown before Vue mounts -->
    <div class="app-loading" id="app-loading">
      <img class="logo" src="/static/images/login/logo.png" alt="Logo" width="80" height="80" />
      <div class="spinner" role="status" aria-label="加载中"></div>
      <p>加载中，请稍候...</p>
    </div>
  </div>

  <!-- Deferred scripts -->
  <script>
    // Remove loading placeholder once Vue app is ready
    window.addEventListener('load', function() {
      var loadingEl = document.getElementById('app-loading');
      if (loadingEl) {
        // Keep it visible briefly for smooth transition
        setTimeout(function() {
          loadingEl.style.transition = 'opacity 0.3s ease';
          loadingEl.style.opacity = '0';
          setTimeout(function() {
            loadingEl.style.display = 'none';
          }, 300);
        }, 200);
      }
    });
  </script>

  <!-- Main entry -->
  <script type="module" src="/main.js"></script>

  <!-- Performance monitoring (optional) -->
  <script>
    if ('performance' in window && 'PerformanceObserver' in window) {
      // Report Core Web Vitals
      try {
        const observer = new PerformanceObserver(function(list) {
          for (const entry of list.getEntries()) {
            // Log or send to analytics
            console.debug('[Performance]', entry.name, entry.startTime, entry.duration);
          }
        });
        observer.observe({ type: 'largest-contentful-paint', buffered: true });
        observer.observe({ type: 'first-input', buffered: true });
        observer.observe({ type: 'layout-shift', buffered: true });
      } catch (e) {
        // PerformanceObserver not supported
      }
    }
  </script>
</body>
</html>
